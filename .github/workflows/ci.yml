name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check curated content links
        run: npm run check:links

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  api:
    name: API — ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  a11y:
    name: A11y — Lighthouse WCAG 2.1 AA gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # WCAG 2.1 AA gate: the axe checks in the frontend job's test run cover
      # the jsdom surfaces; Lighthouse re-verifies the built app in a real
      # browser and fails the build when the accessibility category drops
      # below 100.
      - name: Lighthouse CI — accessibility minScore 1.0
        run: npx --yes @lhci/cli@0.14.0 autorun
